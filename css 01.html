<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile Card</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;justify-content:center;align-items:center;
       background:linear-gradient(135deg,#1e3a8a,#7c3aed);font-family:Segoe UI,Arial,sans-serif}
  .card{width:320px;background:#fff;border-radius:20px;padding:30px 24px;text-align:center;
        box-shadow:0 15px 35px rgba(0,0,0,.3);transition:transform .3s,box-shadow .3s}
  .card:hover{transform:translateY(-10px);box-shadow:0 25px 45px rgba(0,0,0,.4)}
  .card img{width:130px;height:130px;border-radius:50%;object-fit:cover;border:5px solid #7c3aed;
            transition:transform .4s}
  .card:hover img{transform:scale(1.08) rotate(4deg)}
  h2{margin-top:16px;color:#1e293b}
  .role{color:#7c3aed;font-weight:600;margin:4px 0 12px}
  p{color:#64748b;font-size:14px;line-height:1.6}
  .social{display:flex;justify-content:center;gap:12px;margin-top:18px}
  .social a{width:40px;height:40px;border-radius:50%;background:#eef2ff;color:#4338ca;
            display:flex;align-items:center;justify-content:center;text-decoration:none;
            font-weight:700;transition:.3s}
  .social a:hover{background:#7c3aed;color:#fff;transform:translateY(-4px)}
</style>
</head>
<body>
  <div class="card">
    <img src="img.jpeg" alt="Profile">
    <h2>Vaibhav Barse</h2>
    <div class="role">Data Analyst</div>
    <p>BCA graduate who loves turning data into dashboards and building small web apps.</p>
    <div class="social">
      <a href="#">in</a><a href="#">gh</a><a href="#">X</a><a href="#">@</a>
    </div>
  </div>
</body>
</html>
